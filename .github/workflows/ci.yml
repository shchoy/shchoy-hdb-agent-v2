name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Cache the local cross-encoder model
        uses: actions/cache@v4
        with:
          path: .plg/models
          key: rerank-models-${{ hashFiles('src/plg/config.py') }}
      - name: Regenerate ontology artefacts
        run: make ontology
      - name: Fail if the generated ontology artefacts drifted from ontology/
        run: git diff --exit-code -- src/plg/ontology/generated
      - run: uv run mypy
      - run: uv run pytest

  evals:
    # Quality regression gate (#31): the golden datasets' gate subset with real Claude, logged to LangSmith's
    # plg-quality-gate test suite. Skipped (every case) when the repository has no ANTHROPIC_API_KEY secret.
    needs: api  # real Claude only once the offline suite is green
    runs-on: ubuntu-latest
    env:
      PLG_EVALS: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TEST_TRACKING: ${{ secrets.LANGSMITH_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Cache the local cross-encoder model
        uses: actions/cache@v4
        with:
          path: .plg/models
          key: rerank-models-${{ hashFiles('src/plg/config.py') }}
      - run: uv run pytest tests/evals -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Regenerate OpenAPI types
        run: npm run gen:api
      - name: Fail if the generated API types drifted from plg-api
        run: git diff --exit-code -- openapi.json src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  e2e:
    # Browser end-to-end and accessibility checks (#32): Playwright drives the web dev server against one plg-api
    # process with a scripted LLMClient (scripts/e2e_server.py; no API keys, no Docker).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: .
      - name: Cache the local cross-encoder model
        uses: actions/cache@v4
        with:
          path: .plg/models
          key: rerank-models-${{ hashFiles('src/plg/config.py') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
