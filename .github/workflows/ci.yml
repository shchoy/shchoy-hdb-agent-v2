name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Cache the local cross-encoder model
        uses: actions/cache@v4
        with:
          path: .plg/models
          key: rerank-models-${{ hashFiles('src/plg/config.py') }}
      - name: Regenerate ontology artefacts
        run: make ontology
      - name: Fail if the generated ontology artefacts drifted from ontology/
        run: git diff --exit-code -- src/plg/ontology/generated
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Regenerate OpenAPI types
        run: npm run gen:api
      - name: Fail if the generated API types drifted from plg-api
        run: git diff --exit-code -- openapi.json src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
