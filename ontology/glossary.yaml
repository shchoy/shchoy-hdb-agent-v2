# PLG business glossary: versioned GlossaryTerms (see GlossaryTerm in plg.yaml).
# Never delete a version: supersede it (effective_to + status superseded) and add the next one.
# Owners are staff IDs; sources cite _manifest.csv document IDs.
scheme: plg:glossary
concept_class: GlossaryTerm
title: PLG business glossary
concepts:
  # ------------------------------------------------------------------ vacancy (C4)
  - id: plg:Vacant_v1
    concept: plg:Vacant
    version: 1
    pref_label: Vacant unit
    alt_labels: [vacant, vacancy, vacant units]
    definition: >-
      Lettable unit with no active or committed tenancy, including units under tender.
    value: includes units under tender
    source:
      document_id: DOC-012
      locator: Minutes of PLG Management Meeting No. 4/2026, item 3
      quote: Kelvin pointed out that the monthly reports and the QBR count vacancy differently.
    owned_by: S08
    # effective_from omitted: the start of the pre-April 2026 definition is not recorded.
    effective_to: 2026-04-14
    status: superseded
  - id: plg:Vacant_v2
    concept: plg:Vacant
    version: 2
    pref_label: Vacant unit
    alt_labels: [vacant, vacancy, vacant units]
    definition: >-
      Lettable unit with no active or committed tenancy, excluding units under tender. Units under tender and
      units not lettable are reported separately. Historical figures are not restated.
    value: excludes units under tender
    source:
      document_id: DOC-012
      locator: Minutes of PLG Management Meeting No. 4/2026, item 3
      quote: >-
        from the April 2026 report, 'vacant' means units with no active or committed tenancy that are lettable
        and NOT under tender.
    owned_by: S08
    effective_from: 2026-04-15
    supersedes: plg:Vacant_v1
    status: current
  - id: plg:UnderTender_v1
    concept: plg:UnderTender
    version: 1
    pref_label: Under tender
    alt_labels: [on tender, out for tender]
    definition: Vacant unit currently advertised in an open tender. Reported separately from vacant units.
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - Under tender}
    owned_by: S08
    effective_from: 2026-04-15
    status: current
  - id: plg:NotLettable_v1
    concept: plg:NotLettable
    version: 1
    pref_label: Not lettable
    alt_labels: [unlettable]
    definition: >-
      Unit earmarked for upgrading or redevelopment; excluded from the occupancy denominator.
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - Not lettable}
    owned_by: S08
    effective_from: 2026-04-15
    status: current
  - id: plg:OccupancyRate_v1
    concept: plg:OccupancyRate
    version: 1
    pref_label: Occupancy rate
    alt_labels: [occupancy]
    definition: Tenanted units / (total units - not lettable units).
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - Occupancy rate}
    owned_by: S08
    effective_from: 2026-04-15
    status: current
  - id: plg:ActiveTenancy_v1
    concept: plg:ActiveTenancy
    version: 1
    pref_label: Active tenancy
    definition: >-
      A tenancy with status Active whose start date <= reporting date <= end date. Pending Commencement
      tenancies are committed, not active.
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - Active tenancy}
    owned_by: S08
    effective_from: 2026-04-15
    status: current
  - id: plg:CommittedTenancy_v1
    concept: plg:CommittedTenancy
    version: 1
    pref_label: Committed tenancy
    definition: >-
      Tender awarded or offer accepted, not yet commenced (status Pending Commencement). The unit counts as
      tenanted for vacancy.
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - Committed tenancy}
    owned_by: S08
    effective_from: 2026-04-15
    status: current

  # ------------------------------------------------------------------ arrears (C1)
  - id: plg:Arrears_v1
    concept: plg:Arrears
    version: 1
    pref_label: Arrears
    alt_labels: [rental arrears, outstanding rent]
    definition: >-
      Unpaid invoice amounts (including GST) whose due date has passed. Late-payment interest is excluded
      unless stated.
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - Arrears}
    owned_by: S07
    effective_from: 2026-04-15
    status: current
  - id: plg:DaysOverdue_v1
    concept: plg:DaysOverdue
    version: 1
    pref_label: Days overdue
    definition: >-
      Calendar days between the due date of the oldest unpaid invoice and the date of assessment.
    source: {document_id: DOC-001, locator: PLG-POL-003 v1.0 section 3 (Definitions); unchanged in v2.0}
    owned_by: S07
    effective_from: 2024-03-01
    status: current
  - id: plg:MonthsOfArrears_v1
    concept: plg:MonthsOfArrears
    version: 1
    pref_label: Months of arrears
    definition: Total arrears divided by one month's rent inclusive of GST (monthly rent x 1.09).
    source: {document_id: DOC-001, locator: PLG-POL-003 v1.0 section 3 (Definitions); unchanged in v2.0}
    owned_by: S07
    effective_from: 2024-03-01
    status: current
  - id: plg:ArrearsAgeingBucket_v1
    concept: plg:ArrearsAgeingBucket
    version: 1
    pref_label: Arrears ageing bucket
    alt_labels: [ageing bucket, arrears bucket, arrears buckets, ageing]
    definition: Days-overdue bands used in the arrears ageing report.
    value: 0-30, 31-60, 61-90, >90 days overdue
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - Ageing bucket}
    owned_by: S07
    effective_from: 2026-04-15
    status: current
  - id: plg:LodTrigger_v1
    concept: plg:LodTrigger
    version: 1
    pref_label: Letter of Demand trigger
    alt_labels: [LOD, LOD trigger, LOD timing, when to issue a letter of demand]
    definition: >-
      HEB Legal issues a Letter of Demand when any amount is 45 days overdue and no approved instalment plan
      is in force.
    value: 45 days overdue
    source:
      document_id: DOC-001
      locator: PLG-POL-003 v1.0 cl. 4.4
      quote: A Letter of Demand shall be issued by HEB Legal when any amount is 45 days overdue
    owned_by: S07
    effective_from: 2024-03-01
    effective_to: 2026-03-31
    status: superseded
  - id: plg:LodTrigger_v2
    concept: plg:LodTrigger
    version: 2
    pref_label: Letter of Demand trigger
    alt_labels: [LOD, LOD trigger, LOD timing, when to issue a letter of demand]
    definition: >-
      HEB Legal issues a Letter of Demand when any amount is 60 days overdue and no approved instalment plan
      is in force, after the mandatory hardship call between 31 and 45 days overdue.
    value: 60 days overdue
    source:
      document_id: DOC-002
      locator: PLG-POL-003 v2.0 cl. 4.5
      quote: A Letter of Demand shall be issued by HEB Legal when any amount is 60 days overdue
    owned_by: S07
    effective_from: 2026-04-01
    supersedes: plg:LodTrigger_v1
    status: current
  - id: plg:ArrearsTerminationThreshold_v1
    concept: plg:ArrearsTerminationThreshold
    version: 1
    pref_label: Arrears termination threshold
    alt_labels: [termination threshold, arrears > 2 months]
    definition: >-
      Arrears exceeding 2 months' rent (inclusive of GST) go to the Director, PLG with a recommendation on
      termination.
    value: arrears > 2 x monthly rent x 1.09
    source: {document_id: DOC-001, locator: PLG-POL-003 v1.0 cl. 4.5}
    owned_by: S07
    effective_from: 2024-03-01
    effective_to: 2026-03-31
    status: superseded
  - id: plg:ArrearsTerminationThreshold_v2
    concept: plg:ArrearsTerminationThreshold
    version: 2
    pref_label: Arrears termination threshold
    alt_labels: [termination threshold, arrears > 3 months, arrears above 3 months]
    definition: >-
      Arrears exceeding 3 months' rent (inclusive of GST) go to the Director, PLG with a recommendation on
      termination. Measured on the amount, not on the number of unpaid invoices.
    value: arrears > 3 x monthly rent x 1.09
    source: {document_id: DOC-002, locator: PLG-POL-003 v2.0 cl. 4.6}
    owned_by: S07
    effective_from: 2026-04-01
    supersedes: plg:ArrearsTerminationThreshold_v1
    status: current

  # ------------------------------------------------------------------ trade mix and usage (C5)
  - id: plg:DisplayArea_v1
    concept: plg:DisplayArea
    version: 1
    pref_label: Permitted display area beyond shopfront
    alt_labels: [display area, display limit, goods outside shopfront]
    definition: >-
      Tenants may display goods up to 0.6 m beyond the shopfront line, keeping a clear walkway of at least
      1.2 m and removing goods outside operating hours.
    value: 0.6 m
    source:
      document_id: DOC-003
      locator: PLG-POL-001 v3.0 cl. 7.3
      quote: Tenants may display goods up to 0.6 m beyond the shopfront line
    owned_by: S02
    effective_from: 2025-07-01
    effective_to: 2026-07-31
    status: superseded
  - id: plg:DisplayArea_v2
    concept: plg:DisplayArea
    version: 2
    pref_label: Permitted display area beyond shopfront
    alt_labels: [display area, display limit, goods outside shopfront]
    definition: >-
      NC units may display goods up to 1.0 m beyond the shopfront (pilot, max 50% of frontage), overriding
      POL-001 v3.0 cl. 7.3 for NC units. Void-deck shops stay at 0.6 m.
    value: 1.0 m (NC units); 0.6 m (void-deck shops)
    source: {document_id: PDF-002, locator: PLG Circular 07/2026 - Display Area at NCs (Pilot)}
    owned_by: S02
    effective_from: 2026-08-01
    supersedes: plg:DisplayArea_v1
    status: current
  - id: plg:ConcentrationLimit_v1
    concept: plg:ConcentrationLimit
    version: 1
    pref_label: Trade concentration limit
    alt_labels: [concentration limit, same-trade limit]
    definition: >-
      No more than 2 units in the same NC may operate the same trade; 3 for minimarts in NCs with more than
      40 units.
    value: 2 per NC (3 minimarts in NCs > 40 units)
    source: {document_id: DOC-003, locator: PLG-POL-001 v3.0 cl. 5.1}
    owned_by: S02
    effective_from: 2025-07-01
    status: current
  - id: plg:MajorBreach_v1
    concept: plg:MajorBreach
    version: 1
    pref_label: Major breach
    definition: >-
      Inspection outcome of unauthorised trade, unauthorised subletting, fire safety or structural defect
      (finding codes UNAUTH_TRADE, UNAUTH_SUBLET, FIRE_SAFETY, STRUCTURAL_DEFECT).
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - Major breach}
    owned_by: S08
    effective_from: 2026-04-15
    status: current

  # ------------------------------------------------------------------ renewals and deposits (C2, C3)
  - id: plg:RenewalLeadTime_v1
    concept: plg:RenewalLeadTime
    version: 1
    pref_label: Renewal application lead time
    alt_labels: [renewal lead time, when to apply for renewal]
    definition: >-
      Tenants must submit a complete renewal application at least 6 months before the tenancy expires.
    value: 6 months before expiry
    source: {document_id: DOC-004, locator: PLG-POL-002 v2.1 cl. 4.2}
    owned_by: S03
    effective_from: 2025-01-15
    status: current
  - id: plg:LateRenewal_v1
    concept: plg:LateRenewal
    version: 1
    pref_label: Late renewal
    alt_labels: [late renewal application]
    definition: Renewal application submitted less than 6 months before the tenancy end date.
    source: {document_id: DOC-004, locator: PLG-POL-002 v2.1 cl. 4.4}
    owned_by: S03
    effective_from: 2025-01-15
    status: current
  - id: plg:SecurityDeposit_v1
    concept: plg:SecurityDeposit
    version: 1
    pref_label: Security deposit
    alt_labels: [deposit]
    definition: Three months' rent (exclusive of GST), payable before the tenancy or renewed tenancy starts.
    value: 3 months' rent
    source: {document_id: DOC-004, locator: PLG-POL-002 v2.1 cl. 6.1}
    owned_by: S03
    effective_from: 2025-01-15
    status: current

  # ------------------------------------------------------------------ defects
  - id: plg:SlaMet_v1
    concept: plg:SlaMet
    version: 1
    pref_label: SLA met (i-EMS)
    alt_labels: [SLA met, within SLA]
    definition: >-
      An i-EMS ticket meets its SLA when completed date - created date <= SLA days. Misrouted tickets are
      excluded.
    source: {document_id: OTH-004, locator: PLG Glossary of Business Terms - SLA met (i-EMS)}
    owned_by: S10
    effective_from: 2026-04-15
    status: current
