# Semantic layer over PLG Records: SQL bindings for glossary concepts, table notes and example queries.
# `make ontology` checks every concept ID against the glossary and dry-runs every binding (EXPLAIN) against the
# records database. Bindings return the rows behind a figure; wrap them (SELECT COUNT(*) FROM (...)) to aggregate.
# $as_of is the only parameter: the reporting date, defaulting to as_of_default.
as_of_default: 2026-09-30

bindings:
  - concepts: [plg:Vacant_v1]
    note: >-
      The pre-April 2026 definition, still used by the QBR: units under tender count as vacant. Unit status is a
      snapshot taken on 2026-09-30; a unit's vacancy on an earlier date comes from vacant_since, so units that were
      vacant then but have been let since are not visible.
    sql: |
      SELECT u.unit_id, u.status, u.vacant_since
      FROM units u
      WHERE u.status IN ('Vacant', 'Under Tender') AND u.vacant_since <= $as_of
  - concepts: [plg:Vacant_v2]
    note: >-
      Units under tender are reported separately (plg:UnderTender_v1). Unit status is a snapshot taken on
      2026-09-30; a unit's vacancy on an earlier date comes from vacant_since, so units that were vacant then but
      have been let since are not visible.
    sql: |
      SELECT u.unit_id, u.status, u.vacant_since
      FROM units u
      WHERE u.status = 'Vacant' AND u.vacant_since <= $as_of
  - concepts: [plg:UnderTender_v1]
    note: Unit status is a snapshot taken on 2026-09-30.
    sql: |
      SELECT u.unit_id, u.status, u.vacant_since
      FROM units u
      WHERE u.status = 'Under Tender' AND u.vacant_since <= $as_of
  - concepts: [plg:NotLettable_v1]
    note: Unit status is a snapshot taken on 2026-09-30; as_of is ignored.
    sql: |
      SELECT u.unit_id, u.status
      FROM units u
      WHERE u.status = 'Not Lettable'
  - concepts: [plg:OccupancyRate_v1]
    note: Unit status is a snapshot taken on 2026-09-30; as_of is ignored. One row.
    sql: |
      SELECT COUNT(*) FILTER (WHERE status = 'Tenanted') AS tenanted_units,
             COUNT(*) AS total_units,
             COUNT(*) FILTER (WHERE status = 'Not Lettable') AS not_lettable_units,
             ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'Tenanted')
                   / (COUNT(*) - COUNT(*) FILTER (WHERE status = 'Not Lettable')), 1) AS occupancy_pct
      FROM units
  - concepts: [plg:ActiveTenancy_v1]
    sql: |
      SELECT te.tenancy_id, te.unit_id, te.tenant_id, te.start_date, te.end_date, te.monthly_rent
      FROM tenancies te
      WHERE te.status = 'Active' AND te.start_date <= $as_of AND $as_of <= te.end_date
  - concepts: [plg:CommittedTenancy_v1]
    sql: |
      SELECT te.tenancy_id, te.unit_id, te.tenant_id, te.start_date, te.end_date, te.monthly_rent
      FROM tenancies te
      WHERE te.status = 'Pending Commencement'
  - concepts: [plg:Arrears_v1, plg:DaysOverdue_v1, plg:MonthsOfArrears_v1, plg:ArrearsAgeingBucket_v1]
    note: >-
      One row per tenancy in arrears on $as_of: the invoices due before that date with no payment received by
      it, GST included. months_of_rent is arrears / (monthly rent x 1.09). Late-payment interest is not in
      the data.
    sql: |
      SELECT te.tenancy_id, te.tenant_id, tn.name AS tenant_name, te.unit_id,
             ROUND(SUM(i.total_amount), 2) AS arrears,
             COUNT(*) AS unpaid_invoices,
             MIN(i.due_date) AS oldest_due,
             date_diff('day', CAST(MIN(i.due_date) AS DATE), CAST($as_of AS DATE)) AS days_overdue,
             ROUND(SUM(i.total_amount) / (te.monthly_rent * 1.09), 1) AS months_of_rent,
             CASE WHEN date_diff('day', CAST(MIN(i.due_date) AS DATE), CAST($as_of AS DATE)) <= 30 THEN '0-30'
                  WHEN date_diff('day', CAST(MIN(i.due_date) AS DATE), CAST($as_of AS DATE)) <= 60 THEN '31-60'
                  WHEN date_diff('day', CAST(MIN(i.due_date) AS DATE), CAST($as_of AS DATE)) <= 90 THEN '61-90'
                  ELSE '>90' END AS ageing_bucket
      FROM rent_invoices i
      JOIN tenancies te ON te.tenancy_id = i.tenancy_id
      JOIN tenants tn ON tn.tenant_id = te.tenant_id
      WHERE i.due_date < $as_of
        AND NOT EXISTS (SELECT 1 FROM payments p WHERE p.invoice_id = i.invoice_id AND p.paid_date <= $as_of)
      GROUP BY te.tenancy_id, te.tenant_id, tn.name, te.unit_id, te.monthly_rent

# Notes on the tables an agent may query (all of PLG Records except staff).
tables:
  units: One row per lettable unit. status is a snapshot as at 2026-09-30 (Tenanted, Vacant, Under Tender, Not Lettable); vacant_since is set only for units that are not tenanted.
  blocks: Commercial blocks; town_code and nc_id (neighbourhood centre) locate them.
  towns: Six towns with region and estate_manager_id.
  neighbourhood_centres: Three per town.
  tenants: Business entities. brn is the business registration number.
  tenancies: One tenant renting one unit for one trade. status is Active, Renewed, Expired, Terminated or Pending Commencement. monthly_rent is before GST.
  rent_invoices: Monthly invoices Oct 2025 to Sep 2026, due on the 1st of the period month; total_amount includes 9% GST. status is the current state, not the state on an earlier date; use payments.paid_date for that.
  payments: At most one payment per invoice.
  trades: Approved trades with the unit types each may occupy.
  inspections: Inspections with finding_code, outcome and open (closed_date IS NULL) breaches.
  feedback_cases: Public and tenant feedback with reply SLA.
  iems_tickets: Maintenance tickets raised from defect feedback.
  applications: Tenant applications (new, renewal, assignment, change of trade, A&A).
  application_documents: Document checklist per application.
  tasks: Officer work queue. related_id points at different tables depending on task_type.
  letters: Outgoing correspondence log. reference_id points at different tables depending on letter_type.

examples:
  - question: Which tenancies have arrears above 3 months' rent?
    sql: |
      SELECT tenancy_id, tenant_name, unit_id, arrears, days_overdue, months_of_rent
      FROM (<plg:Arrears_v1 binding>) WHERE months_of_rent > 3 ORDER BY months_of_rent DESC
  - question: How many vacant units are there, by town?
    sql: |
      SELECT b.town_code, COUNT(*) AS vacant_units
      FROM (<plg:Vacant_v2 binding>) v JOIN units u ON u.unit_id = v.unit_id JOIN blocks b ON b.block_id = u.block_id
      GROUP BY b.town_code ORDER BY vacant_units DESC
  - question: Which open inspection breaches are overdue for rectification?
    sql: |
      SELECT inspection_id, unit_id, finding_code, outcome, follow_up_due
      FROM inspections WHERE outcome <> 'Compliant' AND closed_date IS NULL AND follow_up_due < $as_of
      ORDER BY follow_up_due

# Known data-quality issues. A query is warned about an issue when it reads `table` and either names one of
# `values` in its SQL or result, or matches `sql_pattern` (a case-insensitive regex over the SQL).
quality_issues:
  - id: duplicate_tenant
    table: tenants
    values: [T-19807, T-10514, "201754388R", Kim Hiap Trading]
    message: >-
      Tenants T-10514 (Kim Hiap Trading) and T-19807 (Kim Hiap Trading Pte. Ltd.) share business registration
      number 201754388R: it is probably one tenant recorded twice, so its figures may be split or counted twice.
  - id: duplicate_payment
    table: payments
    values: [PAY-00001235]
    sql_pattern: 'sum\(\s*[\w.]*amount'
    message: >-
      The payment export repeats PAY-00001235. The duplicate row was skipped when PLG Records was loaded, so totals
      here count it once; check the source export if payment totals are being reconciled.
  - id: impossible_inspection_date
    table: inspections
    values: [INSP-2025-0125, "2099-10-18"]
    sql_pattern: '(max|min)\(\s*[\w.]*inspection_date'
    message: >-
      Inspection INSP-2025-0125 is dated 2099-10-18, an impossible date. Latest-date or date-range figures over
      inspections can be distorted by it.
  - id: outlier_rent
    table: tenancies
    values: [TA-2022-00400]
    sql_pattern: '(sum|avg|max)\(\s*[\w.]*monthly_rent'
    message: >-
      Tenancy TA-2022-00400 has a monthly rent of S$63,100, an outlier far above any other. Totals, averages and
      maxima of monthly rent are distorted by it.
