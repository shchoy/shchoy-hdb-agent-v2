[project]
name = "plg"
version = "0.1.0"
description = "PLG Super-Librarian POC: LangGraph agent, plg-api and CLI"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "langchain-core>=1.6",
    "langgraph>=0.6",
    "langsmith>=0.4",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
plg = "plg.cli:app"
plg-api = "plg.api.app:serve"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["plg"]
